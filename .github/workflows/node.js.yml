name: K6 Performance Testing

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 12 * * *'

jobs:
  run-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup K6
        uses: grafana/setup-k6-action@v1.2.2

      - name: Run official httpbin k6 test
        uses: grafana/run-k6-action@v1.4.0
        with:
          path: src/tests/Httpbin.spec.js

      - name: Upload k6 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: httpbin-k6-report
          path: src/output/httpbin.html
          if-no-files-found: ignore
